<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Combien de tokens par seconde ?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mesurez votre débit de tokens de réflexion en quatre épreuves, et comparez-le aux 150 tokens par seconde avancés par Saturnin Pugnet, aux études scientifiques et aux modèles d'IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/gpt-tokenizer@2.9.0/dist/o200k_base.js" defer></script>
</head>
<body>
<style>
/* Layout : une colonne de lecture (68ch max), quatre épreuves empilées, puis le tableau de bord. Trois langues, textes tirés au sort. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --fg: #15181d;
  --muted: #5d6470;
  --line: #d8dbd5;
  --accent: #2a78d6;      /* vous */
  --accent-ink: #1c5cab;
  --machine: #eb6834;     /* machines */
  --ref: #868d97;         /* références humaines */
  --claim: #15181d;       /* hypothèse Pugnet, trait pointillé */
  --ok: #008300;
  --warn: #c98500;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1a1d21; --fg: #ecede9; --muted: #a7adb6; --line: #2d3238;
    --accent: #3987e5; --accent-ink: #86b6ef; --machine: #d95926; --ref: #7a818b; --claim: #ecede9;
    --ok: #4caf50; --warn: #e0a51a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1a1d21; --fg: #ecede9; --muted: #a7adb6; --line: #2d3238;
  --accent: #3987e5; --accent-ink: #86b6ef; --machine: #d95926; --ref: #7a818b; --claim: #ecede9;
  --ok: #4caf50; --warn: #e0a51a; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
main { max-width: 720px; margin: 0 auto; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(34px, 7vw, 56px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; line-height: 1.5; }

header { padding-top: 40px; display: grid; gap: 18px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.langs button { background: transparent; color: var(--muted); border: 0; border-radius: 0; padding: 6px 10px; font-size: 13px; letter-spacing: 0.04em; }
.langs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
header .lede { font-size: 20px; max-width: 60ch; }
.claim-strip { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 0; }
.claim-strip div { display: grid; gap: 2px; }
.claim-strip .v { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
.claim-strip .v small { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--muted); }

section { display: grid; gap: 16px; }
.protocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; }
.protocol div { display: grid; gap: 4px; border-top: 2px solid var(--line); padding-top: 8px; }
.protocol b { font-family: var(--font-display); font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 22px; display: grid; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-head .state { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.card-head .state.done { color: var(--ok); }
.passage { font-size: 19px; line-height: 1.6; padding: 4px 0; }
.passage.hiddentext { filter: blur(7px); user-select: none; pointer-events: none; }
.passage-title { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button {
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  background: var(--fg); color: var(--bg); border: 1px solid var(--fg); border-radius: 4px; padding: 10px 16px; cursor: pointer;
}
button.secondary { background: transparent; color: var(--fg); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.timer { font-family: var(--font-mono); font-size: 15px; color: var(--muted); min-width: 6ch; }
textarea, input[type="text"] {
  font-family: var(--font-body); font-size: 17px; width: 100%; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg);
}
textarea { min-height: 96px; resize: vertical; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
legend { font-weight: 600; margin-bottom: 4px; }
label.opt { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.result-line { font-size: 15px; border-left: 3px solid var(--accent); padding-left: 12px; display: grid; gap: 2px; }
.result-line .big { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.result-line .big small { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.flag { color: var(--warn); }
.puzzle { display: grid; gap: 10px; }
.puzzle .q { font-size: 18px; }
.puzzle-list { display: grid; gap: 6px; font-size: 15px; padding-left: 20px; margin: 0; }
.puzzle-list li { display: flex; gap: 10px; justify-content: space-between; }

/* Tableau de bord */
.dash { display: grid; gap: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.chart { display: grid; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.legend i.dash { width: 18px; height: 0; border-top: 2px dashed var(--claim); border-radius: 0; }
#chart svg { width: 100%; height: auto; display: block; overflow: visible; }
#chart text { font-family: var(--font-body); fill: var(--fg); font-size: 13px; }
#chart text.axis { fill: var(--muted); font-family: var(--font-mono); font-size: 12px; }
#chart text.val { font-family: var(--font-mono); fill: var(--fg); font-size: 12px; }
#chart line.grid { stroke: var(--line); stroke-width: 1; }
#chart line.claim { stroke: var(--claim); stroke-width: 2; stroke-dasharray: 5 4; }
#chart rect.bar { rx: 2; }
#chart rect.bar.you { fill: var(--accent); }
#chart rect.bar.ref { fill: var(--ref); }
#chart rect.bar.machine { fill: var(--machine); }
#chart rect.bar.empty { fill: none; stroke: var(--accent); stroke-dasharray: 3 3; }
#chart rect.hit { fill: transparent; cursor: default; }
#chart rect.hit:hover + rect.bar, #chart rect.hit:focus + rect.bar { filter: brightness(0.85); }
.tip { position: fixed; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 13px; padding: 6px 9px; border-radius: 4px; max-width: 260px; z-index: 20; }
.share { display: grid; gap: 10px; }
.share textarea { min-height: 210px; font-size: 15px; }
.tabs { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.tabs button { background: transparent; color: var(--muted); border: 0; border-radius: 0; padding: 7px 12px; font-size: 14px; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.verdict { font-size: 17px; border-left: 3px solid var(--machine); padding-left: 12px; }

.sources ol { padding-left: 20px; display: grid; gap: 8px; font-size: 15px; margin: 0; }
footer { border-top: 1px solid var(--line); padding-top: 20px; font-size: 14px; color: var(--muted); display: grid; gap: 6px; }

@media (max-width: 480px) {
  header { padding-top: 28px; }
  .card { padding: 16px; }
  body { font-size: 16px; }
  .passage { font-size: 17px; }
}
@media (prefers-reduced-motion: no-preference) {
  button { transition: opacity 120ms ease; }
}
</style>

<main>
<header>
  <div class="topbar">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>
  <h1 data-i18n="h1"></h1>
  <p class="lede" data-i18n-html="lede"></p>
  <div class="claim-strip">
    <div><span class="eyebrow" data-i18n="strip.claim"></span><span class="v num">150 <small>tok/s</small></span></div>
    <div><span class="eyebrow" data-i18n="strip.llm"></span><span class="v num">70–130 <small>tok/s</small></span></div>
    <div><span class="eyebrow" data-i18n="strip.speech"></span><span class="v num">≈ 3,7 <small>tok/s</small></span></div>
    <div><span class="eyebrow" data-i18n="strip.you"></span><span class="v num" id="hero-you">? <small>tok/s</small></span></div>
  </div>
</header>

<section>
  <h2 data-i18n="protocol.h2"></h2>
  <p data-i18n="protocol.p"></p>
  <div class="protocol">
    <div><b data-i18n="protocol.s1"></b><span class="small muted" data-i18n="protocol.s1d"></span></div>
    <div><b data-i18n="protocol.s2"></b><span class="small muted" data-i18n="protocol.s2d"></span></div>
    <div><b data-i18n="protocol.s3"></b><span class="small muted" data-i18n="protocol.s3d"></span></div>
    <div><b data-i18n="protocol.s4"></b><span class="small muted" data-i18n="protocol.s4d"></span></div>
  </div>
</section>

<!-- Épreuve 1 : lecture silencieuse -->
<section class="card" id="t-read">
  <div class="card-head"><h3 data-i18n="read.h3"></h3><span class="state" id="read-state"></span></div>
  <p class="small muted" data-i18n="read.help"></p>
  <p class="passage-title" id="read-title"></p>
  <p class="passage hiddentext" id="read-text"></p>
  <div class="row">
    <button id="read-start" data-i18n="read.start"></button>
    <button id="read-stop" class="secondary" disabled data-i18n="read.stop"></button>
    <span class="timer" id="read-timer">0,0 s</span>
  </div>
  <div id="read-quiz" hidden>
    <fieldset id="read-q1"></fieldset>
    <fieldset id="read-q2" style="margin-top:10px"></fieldset>
    <div class="row" style="margin-top:10px"><button id="read-validate" data-i18n="validate"></button></div>
  </div>
  <div class="result-line" id="read-result" hidden></div>
</section>

<!-- Épreuve 2 : lecture à voix haute -->
<section class="card" id="t-speak">
  <div class="card-head"><h3 data-i18n="speak.h3"></h3><span class="state" id="speak-state"></span></div>
  <p class="small muted" data-i18n="speak.help"></p>
  <p class="passage hiddentext" id="speak-text"></p>
  <div class="row">
    <button id="speak-start" data-i18n="speak.start"></button>
    <button id="speak-stop" class="secondary" disabled data-i18n="speak.stop"></button>
    <span class="timer" id="speak-timer">0,0 s</span>
  </div>
  <div class="result-line" id="speak-result" hidden></div>
</section>

<!-- Épreuve 3 : frappe -->
<section class="card" id="t-type">
  <div class="card-head"><h3 data-i18n="type.h3"></h3><span class="state" id="type-state"></span></div>
  <p class="small muted" data-i18n="type.help"></p>
  <p class="passage" id="type-text"></p>
  <textarea id="type-input" aria-label="Typing area" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  <div class="row">
    <button id="type-done" data-i18n="type.done"></button>
    <button id="type-reset" class="secondary" data-i18n="type.reset"></button>
    <span class="timer" id="type-timer">0,0 s</span>
  </div>
  <div class="result-line" id="type-result" hidden></div>
</section>

<!-- Épreuve 4 : raisonnement -->
<section class="card" id="t-think">
  <div class="card-head"><h3 data-i18n="think.h3"></h3><span class="state" id="think-state"></span></div>
  <p class="small muted" data-i18n="think.help"></p>
  <div class="row" id="think-startrow"><button id="think-start" data-i18n="think.start"></button></div>
  <div class="puzzle" id="think-puzzle" hidden>
    <p class="eyebrow" id="think-progress"></p>
    <p class="q" id="think-q"></p>
    <div class="row">
      <input type="text" inputmode="decimal" id="think-answer" aria-label="Answer" style="max-width:260px">
      <button id="think-validate" data-i18n="validate"></button>
      <span class="timer" id="think-timer">0,0 s</span>
    </div>
    <p class="small" id="think-feedback"></p>
  </div>
  <ol class="puzzle-list" id="think-list" hidden></ol>
  <div class="result-line" id="think-result" hidden></div>
</section>

<!-- Tableau de bord -->
<section class="dash" id="dash">
  <h2 data-i18n="dash.h2"></h2>
  <p class="small muted" id="dash-note" data-i18n="dash.note"></p>
  <p class="verdict" id="verdict" hidden></p>
  <div class="chart">
    <div class="legend">
      <span><i style="background:var(--accent)"></i><span data-i18n="legend.you"></span></span>
      <span><i style="background:var(--ref)"></i><span data-i18n="legend.ref"></span></span>
      <span><i style="background:var(--machine)"></i><span data-i18n="legend.machine"></span></span>
      <span><i class="dash"></i><span data-i18n="legend.claim"></span></span>
    </div>
    <div id="chart" aria-describedby="dash-note"></div>
  </div>
  <div class="table-wrap">
    <table id="table">
      <thead><tr><th data-i18n="table.measure"></th><th class="n">tok/s</th><th class="n" data-i18n="table.wpm"></th><th data-i18n="table.source"></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="share">
    <h3 data-i18n="share.h3"></h3>
    <p class="small muted" data-i18n="share.help"></p>
    <div class="tabs" role="group" aria-label="Network">
      <button type="button" data-net="linkedin" aria-pressed="true">LinkedIn</button>
      <button type="button" data-net="x" aria-pressed="false">X / Bluesky / Threads</button>
      <button type="button" data-net="short" aria-pressed="false" data-i18n="share.tabShort"></button>
    </div>
    <textarea id="share-text" readonly aria-label="Share text"></textarea>
    <div class="row">
      <button id="share-copy" data-i18n="share.copy"></button>
      <button id="reset-all" class="secondary" data-i18n="share.reset"></button>
      <span class="small muted" id="share-status"></span>
    </div>
  </div>
</section>

<section class="sources">
  <h2 data-i18n="sources.h2"></h2>
  <p data-i18n-html="sources.p"></p>
  <ol id="sources-list"></ol>
</section>

<footer>
  <p data-i18n-html="footer"></p>
  <p id="tok-status"></p>
</footer>
</main>

  ];
  const PUZZLES_PER_RUN = 4;

  // =========================================================================
  // Langue
  // =========================================================================
  let lang = 'fr';
  // Langue par défaut : celle du navigateur. Un #fr/#en/#es dans l'adresse (lien partagé) passe devant ;
  // un choix fait avec les boutons de la page est mémorisé et passe devant le navigateur.
  function browserLang() {
    const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (const l of list) { const c = String(l).slice(0, 2).toLowerCase(); if (LANGS[c]) return c; }
    return 'en';
  }
  function pickInitialLang() {
    const h = (location.hash || '').replace('#', '');
    if (LANGS[h]) return h;
    try { const s = localStorage.getItem('tokens-reflexion-lang'); if (LANGS[s]) return s; } catch (e) { /* ignoré */ }
    return browserLang();
  }
  function t(key, vars) {
    let s = (UI[lang] && UI[lang][key]) || UI.fr[key] || key;
    if (vars) Object.keys(vars).forEach((k) => { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }
  const fmt1 = (n) => n.toLocaleString(LANGS[lang].locale, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmt0 = (n) => Math.round(n).toLocaleString(LANGS[lang].locale);
  const secs = (ms) => fmt1(ms / 1000) + ' s';

  // =========================================================================
  // Tokenizer
  // =========================================================================
  let encoder = null;
  function countTokens(text) {
    if (encoder) { try { return encoder(text).length; } catch (e) { /* repli ci-dessous */ } }
    return Math.round(text.length / LANGS[lang].charsPerToken);
  }
  function countWords(text) { return (text.trim().match(/\S+/g) || []).length; }
  function refreshTokStatus() {
    $('tok-status').textContent = encoder ? t('tok.ok') : t('tok.fallback', { c: fmt1(LANGS[lang].charsPerToken) });
  }
  function tryLoadEncoder() {
    const lib = window.GPTTokenizer_o200k_base;
    if (lib && typeof lib.encode === 'function') { encoder = lib.encode; return true; }
    return false;
  }

  // =========================================================================
  // Stockage local (confort, jamais obligatoire)
  // =========================================================================
  const KEY = 'tokens-reflexion-v2';
  let results = {};
  try { results = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { results = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(results)); } catch (e) { /* ignoré */ } }

  // =========================================================================
  // Outils d'interface
  // =========================================================================
  function makeTimer(el) {
    let start = 0, raf = 0, running = false;
    function tick() { el.textContent = secs(performance.now() - start); if (running) raf = requestAnimationFrame(tick); }
    return {
      start() { start = performance.now(); running = true; cancelAnimationFrame(raf); tick(); },
      stop() { running = false; cancelAnimationFrame(raf); const e = performance.now() - start; el.textContent = secs(e); return e; },
      reset() { running = false; cancelAnimationFrame(raf); el.textContent = '0,0 s'; }
    };
  }
  function showResult(el, tps, wpm, note, flag) {
    el.hidden = false;
    el.innerHTML = '<span class="big num">' + fmt1(tps) + ' <small>tok/s</small></span>' +
      '<span>' + fmt0(wpm) + ' ' + t('wpm') + ' · ' + note + '</span>' + (flag ? '<span class="flag">' + flag + '</span>' : '');
  }
  function setState(id, key) { const s = $(id); s.textContent = t(key); s.classList.toggle('done', key === 'state.done'); }
  function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  // =========================================================================
  // Épreuve 1 : lecture silencieuse (texte tiré au sort, rotation sans répétition)
  // =========================================================================
  const read = (function () {
    const t1 = makeTimer($('read-timer'));
    let order = shuffle([0, 1, 2, 3]), pos = 0, cur = null, fresh = false, elapsed = 0;
    function next() { pos = (pos + 1) % order.length; cur = READ[lang][order[pos]]; place(); }
    function place() {
      if (!cur) return;
      $('read-title').textContent = cur.title; $('read-text').textContent = cur.text;
      [0, 1].forEach((k) => {
        const q = cur.q[k], fs = $('read-q' + (k + 1));
        fs.innerHTML = '<legend>' + esc(q.q) + '</legend>' + q.o.map((o, i) =>
          '<label class="opt"><input type="radio" name="rq' + (k + 1) + '" value="' + i + '"> ' + esc(o) + '</label>').join('');
      });
    }
    $('read-start').addEventListener('click', () => {
      if (!fresh) next();
      fresh = false;
      $('read-text').classList.remove('hiddentext'); $('read-start').disabled = true; $('read-stop').disabled = false;
      $('read-quiz').hidden = true; $('read-result').hidden = true; setState('read-state', 'state.running'); t1.start();
    });
    $('read-stop').addEventListener('click', () => {
      elapsed = t1.stop(); $('read-stop').disabled = true; $('read-text').classList.add('hiddentext'); $('read-quiz').hidden = false;
      $('read-validate').textContent = t('validate');
    });
    $('read-validate').addEventListener('click', () => {
      const a1 = document.querySelector('input[name=rq1]:checked'), a2 = document.querySelector('input[name=rq2]:checked');
      if (!a1 || !a2) { $('read-validate').textContent = t('read.answerBoth'); return; }
      const score = (+a1.value === cur.q[0].a) + (+a2.value === cur.q[1].a);
      const tokens = countTokens(cur.text), words = countWords(cur.text), s = elapsed / 1000;
      results.read = { tps: tokens / s, wpm: words / (s / 60), seconds: s, tokens, score, lang, text: cur.title };
      save(); $('read-quiz').hidden = true; $('read-start').disabled = false; $('read-start').textContent = t('read.again');
      showResult($('read-result'), results.read.tps, results.read.wpm, t('result.note', { t: tokens, s: fmt1(s) }) + ' · ' + t('read.comprehension') + ' ' + score + '/2', score < 2 ? t('read.flag') : '');
      setState('read-state', 'state.done'); render();
    });
    return { relang() { order = shuffle([0, 1, 2, 3]); pos = 0; cur = READ[lang][order[0]]; fresh = true; place(); } };
  })();

  // =========================================================================
  // Épreuve 2 : lecture à voix haute
  // =========================================================================
  (function () {
    const t2 = makeTimer($('speak-timer'));
    $('speak-start').addEventListener('click', () => {
      $('speak-text').classList.remove('hiddentext'); $('speak-start').disabled = true; $('speak-stop').disabled = false;
      $('speak-result').hidden = true; setState('speak-state', 'state.running'); t2.start();
    });
    $('speak-stop').addEventListener('click', () => {
      const s = t2.stop() / 1000, text = SPEAK[lang];
      $('speak-stop').disabled = true; $('speak-start').disabled = false; $('speak-start').textContent = t('speak.again');
      $('speak-text').classList.add('hiddentext');
      const tokens = countTokens(text), words = countWords(text);
      results.speak = { tps: tokens / s, wpm: words / (s / 60), seconds: s, tokens, lang };
      save(); showResult($('speak-result'), results.speak.tps, results.speak.wpm, t('result.note', { t: tokens, s: fmt1(s) }), s < 10 ? t('speak.flag') : '');
      setState('speak-state', 'state.done'); render();
    });
  })();

  // =========================================================================
  // Épreuve 3 : frappe
  // =========================================================================
  (function () {
    const input = $('type-input'), t3 = makeTimer($('type-timer'));
    const norm = (s) => s.replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim();
    let started = false;
    input.addEventListener('input', () => { if (!started && input.value.length > 0) { started = true; setState('type-state', 'state.running'); t3.start(); } });
    $('type-reset').addEventListener('click', () => { input.value = ''; started = false; t3.reset(); $('type-result').hidden = true; setState('type-state', 'state.todo'); });
    $('type-done').addEventListener('click', () => {
      if (!started) return;
      const s = t3.stop() / 1000, target = TYPE[lang]; started = false;
      const a = norm(input.value), b = norm(target);
      let same = 0; for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] === b[i]) same++;
      const accuracy = Math.round(100 * same / b.length);
      const tokens = countTokens(target), words = countWords(target);
      results.type = { tps: tokens / s, wpm: words / (s / 60), seconds: s, tokens, accuracy, lang };
      save(); showResult($('type-result'), results.type.tps, results.type.wpm, t('result.note', { t: tokens, s: fmt1(s) }) + ' · ' + t('type.accuracy') + ' ' + accuracy + ' %', accuracy < 85 ? t('type.flag') : '');
      setState('type-state', 'state.done'); render();
    });
  })();

  // =========================================================================
  // Épreuve 4 : raisonnement (quatre problèmes tirés parmi vingt)
  // =========================================================================
  (function () {
    const t4 = makeTimer($('think-timer'));
    let set = [], i = 0, log = [];
    function show() {
      const p = set[i];
      $('think-progress').textContent = t('think.progress', { i: i + 1, n: set.length });
      $('think-q').textContent = p[lang].q; $('think-answer').value = ''; $('think-feedback').textContent = '';
      $('think-answer').focus(); t4.start();
    }
    function finish() {
      $('think-puzzle').hidden = true; $('think-startrow').hidden = false; $('think-start').textContent = t('think.again');
      const ok = log.filter((l) => l.ok);
      const list = $('think-list'); list.hidden = false;
      list.innerHTML = log.map((l, k) => '<li><span>' + t('think.item', { k: k + 1 }) + ' · ' + (l.ok ? t('think.right') : t('think.wrong', { a: l.a })) + '</span><span class="num">' + fmt1(l.s) + ' s · ' + l.tokens + ' tok</span></li>').join('');
      if (!ok.length) {
        results.think = null; save(); $('think-result').hidden = false; $('think-result').innerHTML = '<span>' + t('think.none') + '</span>';
        setState('think-state', 'state.none'); render(); return;
      }
      const tokens = ok.reduce((a, l) => a + l.tokens, 0), s = ok.reduce((a, l) => a + l.s, 0);
      results.think = { tps: tokens / s, wpm: (tokens / LANGS[lang].tokPerWord) / (s / 60), seconds: s, tokens, correct: ok.length, total: log.length, lang };
      save(); showResult($('think-result'), results.think.tps, results.think.wpm, t('think.note', { t: tokens, s: fmt1(s), ok: ok.length, n: log.length }), '');
      setState('think-state', 'state.done'); render();
    }
    $('think-start').addEventListener('click', () => {
      set = shuffle(PUZZLES).slice(0, PUZZLES_PER_RUN); i = 0; log = [];
      $('think-list').hidden = true; $('think-result').hidden = true; $('think-startrow').hidden = true; $('think-puzzle').hidden = false;
      setState('think-state', 'state.running'); show();
    });
    function validate() {
      const raw = $('think-answer').value.replace(',', '.').replace(/[^0-9.\-]/g, '').trim();
      if (raw === '' || isNaN(parseFloat(raw))) { $('think-feedback').textContent = t('think.enter'); return; }
      const s = t4.stop() / 1000, p = set[i], ok = Math.abs(parseFloat(raw) - p.a) < 0.001;
      log.push({ ok, s, tokens: countTokens(p[lang].cot), a: p.a });
      i++; if (i < set.length) show(); else finish();
    }
    $('think-validate').addEventListener('click', validate);
    $('think-answer').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); validate(); } });
  })();

  // =========================================================================
  // Références et tableau de bord
  // =========================================================================
  function refs() {
    const r = LANGS[lang].tokPerWord, wpmToTps = (w) => w * r / 60, tpsToWpm = (v) => v * 60 / r;
    return [
      { g: 'ref', key: 'type', name: t('ref.type'), tps: wpmToTps(52), wpm: 52, src: t('ref.type.src') },
      { g: 'ref', key: 'bits', name: t('ref.bits'), tps: 2.5, wpm: tpsToWpm(2.5), src: t('ref.bits.src') },
      { g: 'ref', key: 'speak', name: t('ref.speech'), tps: wpmToTps(150), wpm: 150, src: t('ref.speech.src') },
      { g: 'ref', key: 'aloud', name: t('ref.aloud'), tps: wpmToTps(183), wpm: 183, src: t('ref.aloud.src') },
      { g: 'ref', key: 'read', name: t('ref.read'), tps: wpmToTps(238), wpm: 238, src: t('ref.read.src') },
      { g: 'ref', key: 'inner', name: t('ref.inner'), tps: wpmToTps(4000), wpm: 4000, src: t('ref.inner.src') },
      { g: 'machine', name: 'Claude Fable 5.1', tps: 68, wpm: tpsToWpm(68), src: t('ref.claude.src') },
      { g: 'machine', name: 'Gemini 3.1 Pro', tps: 134, wpm: tpsToWpm(134), src: t('ref.gemini.src') },
      { g: 'machine', name: 'Gemini 3.5 Flash', tps: 280, wpm: tpsToWpm(280), src: t('ref.flash.src') }
    ];
  }
  const YOU_KEYS = ['read', 'speak', 'type', 'think'];
  const REF_FOR = { read: 'read', speak: 'speak', type: 'type', think: 'bits' };
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
  let net = 'linkedin';

  function render() {
    const R = refs();
    const yours = YOU_KEYS.map((k) => ({ g: 'you', key: k, name: t('you.' + k), tps: results[k] ? results[k].tps : null, wpm: results[k] ? results[k].wpm : null, src: t('you.src') }));
    const rows = [...yours, ...R];
    const W = 720, left = 230, right = 56, rowH = 26, gap = 10, top = 28;
    const H = top + rows.length * rowH + 2 * gap + 34;
    const min = 1, max = 1000, plotW = W - left - right;
    const x = (v) => left + plotW * Math.log10(Math.max(v, min)) / Math.log10(max);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="tok/s, log scale">';
    [1, 10, 100, 1000].forEach((v) => {
      s += '<line class="grid" x1="' + x(v) + '" x2="' + x(v) + '" y1="' + (top - 6) + '" y2="' + (H - 28) + '"/>';
      s += '<text class="axis" x="' + x(v) + '" y="' + (H - 10) + '" text-anchor="middle">' + v + '</text>';
    });
    s += '<text class="axis" x="' + (W - right) + '" y="' + (H - 10) + '" text-anchor="end">tok/s</text>';
    let y = top, lastG = null;
    rows.forEach((r, idx) => {
      if (r.g !== lastG) { if (lastG !== null) y += gap; lastG = r.g; }
      const cy = y + rowH / 2;
      s += '<text x="' + (left - 10) + '" y="' + (cy + 4) + '" text-anchor="end">' + esc(r.name) + '</text>';
      if (r.tps == null) {
        s += '<rect class="bar empty" x="' + x(min) + '" y="' + (y + 7) + '" width="' + (x(3) - x(min)) + '" height="' + (rowH - 14) + '"/>';
      } else {
        const v = Math.min(r.tps, max), w = Math.max(x(v) - x(min), 3);
        s += '<rect class="hit" data-i="' + idx + '" tabindex="0" x="' + left + '" y="' + y + '" width="' + plotW + '" height="' + rowH + '"/>';
        s += '<rect class="bar ' + r.g + '" x="' + x(min) + '" y="' + (y + 7) + '" width="' + w + '" height="' + (rowH - 14) + '"/>';
        s += '<text class="val" x="' + (x(v) + 8) + '" y="' + (cy + 4) + '">' + fmt1(r.tps) + '</text>';
      }
      y += rowH;
    });
    s += '<line class="claim" x1="' + x(CLAIM) + '" x2="' + x(CLAIM) + '" y1="' + (top - 12) + '" y2="' + (H - 28) + '"/>';
    s += '<text class="axis" x="' + (x(CLAIM) + 6) + '" y="' + (top - 10) + '">150</text></svg>';
    $('chart').innerHTML = s;
    $('chart').querySelectorAll('rect.hit').forEach((h) => {
      const r = rows[+h.dataset.i];
      const showTip = (e) => {
        tip.hidden = false; tip.textContent = r.name + ' : ' + fmt1(r.tps) + ' tok/s (≈ ' + fmt0(r.wpm) + ' ' + t('wpm') + '). ' + r.src;
        tip.style.left = Math.min((e.clientX || 0) + 12, window.innerWidth - 270) + 'px'; tip.style.top = ((e.clientY || 0) + 14) + 'px';
      };
      h.addEventListener('mousemove', showTip); h.addEventListener('focus', () => { const b = h.getBoundingClientRect(); showTip({ clientX: b.left + 20, clientY: b.top }); });
      h.addEventListener('mouseleave', () => { tip.hidden = true; }); h.addEventListener('blur', () => { tip.hidden = true; });
    });

    // Tableau
    $('table').querySelector('tbody').innerHTML = rows.map((r) => '<tr><td>' + esc(r.name) + '</td><td class="n">' + (r.tps == null ? '—' : fmt1(r.tps)) + '</td><td class="n">' + (r.wpm == null ? '—' : fmt0(r.wpm)) + '</td><td class="small muted">' + esc(r.src) + '</td></tr>').join('') +
      '<tr><td>' + t('claim.name') + '</td><td class="n">' + fmt1(CLAIM) + '</td><td class="n">' + fmt0(CLAIM * 60 / LANGS[lang].tokPerWord) + '</td><td class="small muted">' + t('claim.src') + '</td></tr>';

    // Chiffre du haut : médiane de vos mesures
    const done = yours.filter((r) => r.tps != null);
    const vals = done.map((r) => r.tps).sort((a, b) => a - b);
    const hero = $('hero-you');
    let med = null;
    if (vals.length) {
      med = vals.length % 2 ? vals[(vals.length - 1) / 2] : (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2;
      hero.innerHTML = fmt1(med) + ' <small>tok/s</small>';
    } else hero.innerHTML = '? <small>tok/s</small>';

    // Lecture qualitative : point fort (meilleur ratio à la référence), goulot (débit le plus bas), écart au modèle
    const refByKey = {}; R.forEach((r) => { if (r.key) refByKey[r.key] = r; });
    const profile = done.map((r) => ({ key: r.key, tps: r.tps, ratio: r.tps / refByKey[REF_FOR[r.key]].tps }));
    const strong = profile.slice().sort((a, b) => b.ratio - a.ratio)[0];
    const weak = profile.slice().sort((a, b) => a.tps - b.tps)[0];
    const verdict = $('verdict');
    if (med != null) { verdict.hidden = false; verdict.textContent = verdictText(med, strong, weak, profile.length); } else verdict.hidden = true;
    $('share-text').value = med == null ? t('share.empty') : shareText(net, med, done, strong, weak);
  }

  function ratioWord(x) { return (x >= 10 ? fmt0(x) : fmt1(x)) + '×'; }
  function verdictText(med, strong, weak, n) {
    const gap = ratioWord(LLM_REF / med), claimGap = ratioWord(CLAIM / med);
    const V = {
      fr: 'Votre médiane : ' + fmt1(med) + ' tok/s. Un modèle frontière sort ses tokens ' + gap + ' plus vite, et l\'hypothèse de 150 est ' + claimGap + ' au-dessus de vous.' +
          (n > 1 ? ' Votre point fort : ' + t('short.' + strong.key) + ' (' + ratioWord(strong.ratio) + ' la référence publiée). Votre goulot : ' + t('short.' + weak.key) + ', à ' + fmt1(weak.tps) + ' tok/s.' : ''),
      en: 'Your median: ' + fmt1(med) + ' tok/s. A frontier model emits tokens ' + gap + ' faster, and the 150 assumption sits ' + claimGap + ' above you.' +
          (n > 1 ? ' Your strength: ' + t('short.' + strong.key) + ' (' + ratioWord(strong.ratio) + ' the published reference). Your bottleneck: ' + t('short.' + weak.key) + ', at ' + fmt1(weak.tps) + ' tok/s.' : ''),
      es: 'Su mediana: ' + fmt1(med) + ' tok/s. Un modelo de frontera emite tokens ' + gap + ' más rápido, y la hipótesis de 150 está ' + claimGap + ' por encima de usted.' +
          (n > 1 ? ' Su punto fuerte: ' + t('short.' + strong.key) + ' (' + ratioWord(strong.ratio) + ' la referencia publicada). Su cuello de botella: ' + t('short.' + weak.key) + ', a ' + fmt1(weak.tps) + ' tok/s.' : '')
    };
    return V[lang];
  }
  function shareText(network, med, done, strong, weak) {
    const gap = ratioWord(LLM_REF / med), claimGap = ratioWord(CLAIM / med);
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const lines = done.map((r) => cap(t('short.' + r.key)) + ' : ' + fmt1(r.tps) + ' tok/s').join('\n');
    const inline = done.map((r) => t('short.' + r.key) + ' ' + fmt1(r.tps)).join(', ');
    const multi = done.length > 1;
    const S = {
      fr: {
        linkedin: 'J\'ai mesuré mon débit de tokens de réflexion.\n\n' + lines + '\n\n' +
          (multi ? 'Mon point fort : ' + t('short.' + strong.key) + ', ' + ratioWord(strong.ratio) + ' la moyenne publiée. Mon goulot : ' + t('short.' + weak.key) + ', à ' + fmt1(weak.tps) + ' tok/s.\n\n' : '') +
          'On entend dire qu\'un humain réfléchit à 150 tokens par seconde. Un LLM en sort 70 à 300. Moi : ' + fmt1(med) + ' en médiane. L\'écart avec la machine n\'est pas de 1 à 1, il est de 1 à ' + gap.replace('×', '') + '.\n\n' +
          'Quand les machines produisent sans limite, la ressource rare, c\'est le temps de celui qui décide.\n\n' +
          'Mesurez le vôtre, deux minutes, open source, rien n\'est collecté :\n' + PAGE_URL + '\n\n#IA #tokens #attention #cognition',
        x: 'Mes tokens de réflexion : ' + inline + ' tok/s. Médiane ' + fmt1(med) + '. Un LLM : 70 à 300. On parle de 150 par humain, je mesure ' + claimGap.replace('×', '') + ' fois moins. Testez le vôtre (2 min, open source) : ' + PAGE_URL,
        short: 'Je pense à ' + fmt1(med) + ' tokens par seconde. Un LLM, ' + gap + ' plus vite. Et vous ? ' + PAGE_URL
      },
      en: {
        linkedin: 'I measured my throughput in tokens of thought.\n\n' + lines + '\n\n' +
          (multi ? 'My strength: ' + t('short.' + strong.key) + ', ' + ratioWord(strong.ratio) + ' the published average. My bottleneck: ' + t('short.' + weak.key) + ', at ' + fmt1(weak.tps) + ' tok/s.\n\n' : '') +
          'People say a human thinks at 150 tokens per second. An LLM emits 70 to 300. Me: ' + fmt1(med) + ' median. The gap with the machine is not 1 to 1, it is 1 to ' + gap.replace('×', '') + '.\n\n' +
          'When machines produce without limit, the scarce resource is the time of whoever decides.\n\n' +
          'Measure yours, two minutes, open source, nothing collected:\n' + PAGE_URL + '\n\n#AI #tokens #attention #cognition',
        x: 'My tokens of thought: ' + inline + ' tok/s. Median ' + fmt1(med) + '. An LLM: 70 to 300. The claim is 150 per human, I measure ' + claimGap.replace('×', '') + ' times less. Test yours (2 min, open source): ' + PAGE_URL,
        short: 'I think at ' + fmt1(med) + ' tokens per second. An LLM, ' + gap + ' faster. You? ' + PAGE_URL
      },
      es: {
        linkedin: 'He medido mi caudal de tokens de reflexión.\n\n' + lines + '\n\n' +
          (multi ? 'Mi punto fuerte: ' + t('short.' + strong.key) + ', ' + ratioWord(strong.ratio) + ' la media publicada. Mi cuello de botella: ' + t('short.' + weak.key) + ', a ' + fmt1(weak.tps) + ' tok/s.\n\n' : '') +
          'Se dice que un humano piensa a 150 tokens por segundo. Un LLM emite de 70 a 300. Yo: ' + fmt1(med) + ' de mediana. La distancia con la máquina no es de 1 a 1, es de 1 a ' + gap.replace('×', '') + '.\n\n' +
          'Cuando las máquinas producen sin límite, el recurso escaso es el tiempo de quien decide.\n\n' +
          'Mida el suyo, dos minutos, open source, no se recoge nada:\n' + PAGE_URL + '\n\n#IA #tokens #atención #cognición',
        x: 'Mis tokens de reflexión: ' + inline + ' tok/s. Mediana ' + fmt1(med) + '. Un LLM: de 70 a 300. Se habla de 150 por humano, yo mido ' + claimGap.replace('×', '') + ' veces menos. Pruebe el suyo (2 min, open source): ' + PAGE_URL,
        short: 'Pienso a ' + fmt1(med) + ' tokens por segundo. Un LLM, ' + gap + ' más rápido. ¿Y usted? ' + PAGE_URL
      }
    };
    return S[lang][network];
  }

  document.querySelectorAll('.tabs [data-net]').forEach((b) => b.addEventListener('click', () => {
    net = b.dataset.net; document.querySelectorAll('.tabs [data-net]').forEach((o) => o.setAttribute('aria-pressed', String(o === b))); render();
  }));
  $('share-copy').addEventListener('click', () => {
    const ta = $('share-text'), status = $('share-status');
    const fallback = () => { ta.focus(); ta.select(); status.textContent = t('share.selected'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => { status.textContent = t('share.copied'); }, fallback);
    else fallback();
  });
  $('reset-all').addEventListener('click', () => {
    results = {}; save();
    YOU_KEYS.forEach((k) => { $(k + '-result').hidden = true; setState(k + '-state', 'state.todo'); });
    $('think-list').hidden = true; render();
  });

  // =========================================================================
  // Application de la langue
  // =========================================================================
  function applyLang(next, fromHash, explicit) {
    lang = next; document.documentElement.lang = lang;
    if (explicit) { try { localStorage.setItem('tokens-reflexion-lang', lang); } catch (e) { /* ignoré */ } }
    if (!fromHash && location.hash !== '#' + lang) { try { history.replaceState(null, '', '#' + lang); } catch (e) { location.hash = lang; } }
    document.querySelectorAll('.langs [data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.title = t('h1');
    $('type-input').placeholder = t('type.placeholder'); $('think-answer').placeholder = t('think.placeholder');
    $('speak-text').textContent = SPEAK[lang]; $('type-text').textContent = TYPE[lang];
    $('sources-list').innerHTML = SOURCES.map((s) => '<li><a href="' + s.href + '">' + s.title + '</a>. ' + s[lang] + '</li>').join('');
    read.relang();
    YOU_KEYS.forEach((k) => {
      const r = results[k];
      if (r) { showResult($(k + '-result'), r.tps, r.wpm, t('result.note', { t: r.tokens, s: fmt1(r.seconds) }) + ' ' + t('result.prev'), ''); setState(k + '-state', 'state.done'); }
      else setState(k + '-state', 'state.todo');
    });
    refreshTokStatus(); render();
  }
  document.querySelectorAll('.langs [data-lang]').forEach((b) => b.addEventListener('click', () => applyLang(b.dataset.lang, false, true)));
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (LANGS[h] && h !== lang) applyLang(h, true); });

  if (!tryLoadEncoder()) {
    const sc = document.querySelector('script[src*="gpt-tokenizer"]');
    if (sc) { sc.addEventListener('load', () => { tryLoadEncoder(); refreshTokStatus(); }); sc.addEventListener('error', refreshTokStatus); }
    setTimeout(() => { if (!encoder) tryLoadEncoder(); refreshTokStatus(); }, 4000);
  }
  applyLang(pickInitialLang(), true);
})();
</script>

</body>
